<!DOCTYPE html>
<html lang="es"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tile Panel</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }

        /* Configuración del Administrador */
        #admin-panel {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            max-width: 600px;
        }

        /* Cabecera del panel */
        .admin-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.3rem;
            color: #2c3e50;
        }

        /* Botón del emoji de info */
        .info-trigger {
            cursor: pointer;
            font-size: 1.2rem;
            line-height: 1;
            transition: transform 0.2s ease;
            user-select: none;
        }

        .info-trigger:hover {
            transform: scale(1.15);
        }

        /* --- NUEVO: Modal de instrucciones superpuesto en el centro --- */
        #instructions-overlay {
            display: none; /* Oculto por defecto */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6); /* Fondo semi-transparente oscuro */
            z-index: 2000; /* Por encima de todo, incluso del QR */
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(3px); /* Ligero desenfoque de fondo */
        }

        .instructions-modal {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            position: relative;
            animation: fadeInScale 0.3s ease-out;
        }

        .instructions-modal h4 {
            margin-top: 0;
            color: #2c3e50;
            font-size: 1.2rem;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .instructions-modal p {
            font-size: 14.5px;
            line-height: 1.6;
            color: #555;
            margin-bottom: 20px;
        }

        /* Botón para cerrar el pop-up */
        .btn-close-modal {
            background-color: #34495e;
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            float: right;
        }

        .btn-close-modal:hover {
            background-color: #2c3e50;
        }

        /* Animación de entrada para el modal */
        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        /* ------------------------------------------------------------- */

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        input[type="text"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #27ae60;
        }

        #btn-export {
            background-color: #e67e22;
            display: none;
        }

        #btn-export:hover {
            background-color: #d35400;
        }

/* CONTENEDOR QR */
#qr-container {
    position: fixed;   /* Keeps it pinned relative to viewport when scrolling */
    top: 10px;         /* Distance from top edge */
    right: 10px;       /* Distance from right edge */
    background: white;
    padding: 4px;      /* Compact border padding */
    border-radius: 6px; /* Proportionally smaller rounded corners */
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    cursor: pointer;
    transition: transform 0.2s ease;
    z-index: 100;
    width: 44px;       /* Micro dimensions (matches standard touch targets) */
    height: 44px;      /* Keeps standard square 1:1 ratio */
    display: flex;
    justify-content: center;
    align-items: center;
}

        #qr-container:hover {
            transform: scale(1.05);
        }

        .qr-image {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain !important;
            display: block;
        }

        #qr-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        #qr-large {
            background: white;
            padding: 20px;
            border-radius: 16px;
            width: 280px;
            height: 280px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Grid de Azulejos Autoadaptable */
        #tiles-grid {
            display: grid;
            gap: 20px;
            max-width: 1200px;
            margin: 40px auto;
        }

        @media (orientation: portrait) {
            #tiles-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (orientation: landscape) {
            #tiles-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .tile {
            color: #2c3e50;
            aspect-ratio: 1 / 1;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3.8rem;
            font-weight: bold;
            border-radius: 16px;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .tile:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.12);
        }

        .empty-tile {
            aspect-ratio: 1 / 1;
        }

        #status-message {
            font-weight: bold;
            color: #c0392b;
            margin-top: 10px;
        }
    </style>
<style>
  .imageye-selected {
    outline: 2px solid black !important;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.5) !important;
  }
</style></head>
<body>

    

    

    <div id="qr-container" onclick="abrirQR()" title="Click para agrandar">
        <img id="qrcode" class="qr-image" alt="QR Link" src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&amp;data=https%3A%2F%2Fjlts059.github.io%2Fapps%2Futilidades%2Ftilelinks_1.4.html">
    </div>

    <div id="qr-overlay" onclick="cerrarQR()">
        <div id="qr-large">
            <img id="qrcode-large" class="qr-image" alt="QR Link Grande" src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&amp;data=https%3A%2F%2Fjlts059.github.io%2Fapps%2Futilidades%2Ftilelinks_1.4.html">
        </div>
    </div>

    <div id="tiles-grid"><a class="tile" href="https://drive.google.com/file/d/1bWxj9SztiS20BUpTa2u1UaTuBC0Fkt8I/preview?usp=drivesdk" target="_blank" style="background-color: rgb(241, 225, 177);">A</a><a class="tile" href="https://drive.google.com/file/d/1wfuMqOFo5yzGGYipR_71QZyPakjzQdmY/preview?usp=drivesdk" target="_blank" style="background-color: rgb(209, 241, 177);">B</a></div>

    <script>
                    const urlActual = window.location.href;
                    const qrUrlBase = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(urlActual)}`;
                    document.getElementById("qrcode").src = qrUrlBase;
                    document.getElementById("qrcode-large").src = qrUrlBase;

                    function abrirQR() { document.getElementById('qr-overlay').style.display = 'flex'; }
                    function cerrarQR() { document.getElementById('qr-overlay').style.display = 'none'; }
                </script>

</body><text-blaze-app-reference style="display: contents !important;" role="none"></text-blaze-app-reference></html>
