<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Flashcard Study Tool</title>

<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: #f0f2f5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    overflow-x: hidden;
  }

  /* SETUP VIEW */
  #setup-container {
    background: white;
    padding: 2rem;
    border-radius: 24px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.1);
    max-width: 600px;
    width: 90%;
    text-align: center;
  }

  .input-field {
    width: 100%;
    padding: 12px;
    margin: 0.5rem 0 1rem 0;
    border: 2px solid #e0e6ed;
    border-radius: 12px;
    font-family: inherit;
    box-sizing: border-box;
    font-size: 1rem;
  }

  textarea {
    width: 100%;
    height: 180px;
    margin: 0.5rem 0 1rem 0;
    padding: 10px;
    border: 2px solid #e0e6ed;
    border-radius: 12px;
    font-family: inherit;
    box-sizing: border-box;
  }

  /* FLASHCARD VIEW */
  #flashcard-view {
    display: none;
    flex-direction: column;
    align-items: center;
    width: 100%;
    position: relative;
  }

  /* HEADER TOP BAR (Progress & Title) */
  .top-bar-header {
    width: 90%;
    max-width: 550px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .progress { 
    font-size: 0.9rem; 
    color: #90a4ae; 
    font-weight: bold; 
  }

  #deck-title-display {
    font-size: 1rem;
    color: #2c3e50;
    font-weight: 600;
  }

  /* TOP RIGHT UTILITIES (QR & INFO) */
  .utility-top-right {
    position: absolute;
    top: 0px;
    right: 20px;
    display: flex;
    align-items: center;
    gap: 15px;
    z-index: 10;
  }

  #open-qr-btn {
    font-size: 1.6rem;
    cursor: pointer;
    user-select: none;
    line-height: 1;
    transition: transform 0.1s ease;
  }
  #open-qr-btn:active { transform: scale(0.9); }

  .info-btn {
    font-size: 1.6rem;
    cursor: pointer;
    user-select: none;
    line-height: 1;
    transition: transform 0.1s ease;
  }
  .info-btn:active { transform: scale(0.9); }

  @media (max-width: 900px) {
    .utility-top-right { display: none; }
  }

  #indicators-container {
    display: flex;
    gap: 10px;
    min-height: 24px;
    margin-bottom: 5px;
  }

  #star-indicator {
    font-size: 1rem;
    font-weight: bold;
    color: #f1c40f;
    visibility: hidden;
  }

  #error-indicator {
    font-size: 1rem;
    font-weight: bold;
    color: #e67e22;
    visibility: hidden;
  }

  #card {
    background: white;
    border-radius: 24px;
    padding: 2.5rem 1.5rem;
    max-width: 550px;
    width: 90%;
    min-height: 280px;
    display: flex;
    flex-direction: column; 
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 1.6rem;
    line-height: 1.4;
    cursor: pointer;
    box-shadow: 0 15px 35px rgba(0,0,0,0.1);
    transition: transform 0.1s ease, background 0.3s ease;
    border-bottom: 8px solid #2c3e50;
    margin-bottom: 25px;
    color: #2c3e50;
    word-wrap: break-word;
    overflow-wrap: break-word;
    position: relative;
  }

  #card:active { transform: scale(0.98); }

  .controls-container {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 90%;
    max-width: 550px;
    align-items: center;
  }

  .controls-row { 
    display: flex; 
    gap: 8px; 
    justify-content: center; 
    width: 100%;
    flex-wrap: wrap;
  }

  button {
    padding: 0.8rem 1.2rem;
    font-size: 1.3rem; /* Emojis stand out much clearer now */
    border-radius: 12px;
    border: none;
    cursor: pointer;
    font-weight: bold;
    transition: all 0.2s;
    flex: 1;
    min-width: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* HIGH VISIBILITY VIBRANT CONTRAST COLOURS */
  .btn-next { background: #34495e; color: white; box-shadow: 0 5px 0 #2c3e50; }
  .btn-know { background: #1b5e20; color: white; box-shadow: 0 5px 0 #0d3c12; } 
  .btn-discard { background: #00c853; color: white; box-shadow: 0 5px 0 #00c8538c; } 
  .btn-secondary { background: #e0e6ed; color: white; box-shadow: 0 5px 0 #b0bec5; }
  .btn-star { background: #ffea00; box-shadow: 0 5px 0 #ffd600; }
  .btn-error { background: #ff6d00; color: white; box-shadow: 0 5px 0 #dd2c00; }
  
  .btn-save { background: #00b0ff; color: white; box-shadow: 0 4px 0 #0091ea; font-size: 0.85rem; }
  .btn-utility { background: #ffffff; color: #2c3e50; box-shadow: 0 4px 0 #cfd8dc; border: 1px solid #cfd8dc; font-size: 0.85rem; }

  button:active { transform: translateY(2px); box-shadow: none; }
  button:disabled { background: #ccc !important; color: #666 !important; cursor: not-allowed; box-shadow: none !important; transform: none !important; }

  /* GENERAL MODAL SYSTEM */
  .modal {
    display: none;
    position: fixed;
    z-index: 100;
    left: 0; top: 0; width: 100%; height: 100%;
    background-color: rgba(0,0,0,0.5);
  }
  .modal-content {
    background-color: white;
    margin: 5% auto;
    padding: 25px;
    border-radius: 15px;
    width: 80%;
    max-width: 700px;
    max-height: 80vh;
    overflow-y: auto;
    position: relative;
  }
  
  /* CENTERED VIEW FOR INSTRUCTIONS & QR */
  .modal-centered-content {
    margin: 12% auto;
    max-width: 420px;
    text-align: center;
  }

  /* DISCRETE X CLOSING BUTTON */
  .close-x {
    position: absolute;
    top: 12px;
    right: 15px;
    font-size: 1.2rem;
    color: #90a4ae;
    cursor: pointer;
    user-select: none;
    font-weight: 300;
    transition: color 0.2s;
  }
  .close-x:hover { color: #546e7a; }

  #classroom-qr-container img {
    max-width: 100%;
    height: auto;
    display: block;
    margin: 0 auto;
  }

  table { width: 100%; border-collapse: collapse; margin-top: 15px; }
  th, td { border: 1px solid #ddd; padding: 12px; text-align: left; font-size: 0.9rem; }
  th { background-color: #f8f9fa; }
</style>
</head>
<body>

  <div id="setup-container">
    <h2 style="color: #2c3e50; margin-top: 0; margin-bottom: 1.5rem;">Create Your Deck</h2>
    
    <label style="display:block; text-align:left; font-weight:bold; color:#2c3e50; font-size:0.9rem;">Deck Title:</label>
    <input type="text" id="deck-title-input" class="input-field" placeholder="Enter deck title...">
    
    <label style="display:block; text-align:left; font-weight:bold; color:#2c3e50; font-size:0.9rem;">Flashcard Content:</label>
    <textarea id="csv-input" placeholder="Term [TAB] Definition &#10;or: Term , Definition"></textarea>
    
    <button style="background: #27ae60; color: white; width: 100%; font-size: 1.1rem;" onclick="loadCustomDeck()">Generate Flashcards ➔</button>
  </div>

  <div id="flashcard-view">
    <div class="utility-top-right">
      <div id="open-qr-btn" onclick="openQRModal()" title="View QR Link">🔲</div>
      <div class="info-btn" onclick="openInfoModal()" title="Instructions">ℹ️</div>
    </div>

    <!-- UPPER TOP BAR -->
    <div class="top-bar-header">
      <div class="progress" id="progress">Card 0 of 0</div>
      <div id="deck-title-display">Custom Deck</div>
    </div>
    
    <div id="indicators-container">
      <span id="star-indicator">⭐ Starred</span>
      <span id="error-indicator">⚠️ Error</span>
    </div>
    
    <div id="card" onclick="flipCard()">Loading...</div>
    
    <div class="controls-container">
      <div class="controls-row">
        <!-- COLOURED HIGHER CONTRAST EMOJI INTERFACE -->
        <button class="btn-next" id="nextBtn" onclick="nextCard()" title="Next (V)">➡️</button>
        <button class="btn-know" id="knowBtn" onclick="knowCard()" title="Discard (Z)">🗑️</button>
        <button class="btn-discard" id="discardBtn" onclick="discardCardWithPeek()" title="Peek & Discard (X)">👀+🗑️</button>
        <button class="btn-secondary" id="shuffleBtn" onclick="shuffleDeck()" title="Shuffle">🔀</button>
        <button class="btn-secondary" id="restartBtn" onclick="resetDeckSequential()" title="Restart">🔄</button>
        <button class="btn-star" id="starBtn" onclick="toggleStar()" title="Star (C)">⭐</button>
        <button class="btn-error" id="errorBtn" onclick="toggleError()" title="Report Error (E)">⚠️</button>
      </div>
      
      <div class="controls-row">
        <button class="btn-save" id="saveFullBtn" onclick="downloadDeck('full')">💾 Save Full</button>
        <button class="btn-save" id="saveLeftBtn" onclick="downloadDeck('left')">💾 Save Left</button>
        <button class="btn-save" id="saveStarBtn" onclick="downloadDeck('star')">💾 Save Star</button>
      </div>

      <div class="controls-row" style="margin-top: 10px;">
        <button class="btn-utility" id="listBtn" onclick="showList('all')">👁 Show Full List</button>
        <button class="btn-utility" id="leftListBtn" onclick="showList('left')">⏳ Show Left List</button>
        <button class="btn-utility" id="starListBtn" onclick="showList('star')">⭐ Show Star List</button>
        <button class="btn-utility" id="errorListBtn" onclick="showList('error')">⚠️ Show Error List</button>
        <button class="btn-utility" id="newBtn" onclick="location.reload()">↺ New List</button>
      </div>
    </div>
  </div>

  <!-- VOCABULARY LIST MODAL -->
  <div id="list-modal" class="modal" onclick="closeList(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div style="display:flex; justify-content: space-between; align-items: center;">
        <h3 id="modal-title" style="margin:0">Vocabulary List</h3>
        <div style="display: flex; gap: 10px; margin-right: 25px;">
          <button id="download-txt-btn" class="btn-save" onclick="downloadErrorTxt()" style="display:none; flex:none; width:auto; padding: 0.4rem 1rem;">⬇️ Download TXT</button>
        </div>
      </div>
      <span class="close-x" onclick="closeList(event)">✕</span>
      <table id="vocab-table">
        <thead><tr><th>Column 1</th><th>Column 2</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <!-- INSTRUCTIONS MODAL -->
  <div id="info-modal" class="modal" onclick="closeInfoModal()">
    <div class="modal-content modal-centered-content" onclick="event.stopPropagation()">
      <span class="close-x" onclick="closeInfoModal()">✕</span>
      <h3 style="margin-top: 0; color: #2c3e50;">Instructions</h3>
      <p style="color: #546e7a; line-height: 1.5; margin-bottom: 5px;">aquí irán las instrucciones de cómo usarlo</p>
    </div>
  </div>

  <!-- CENTERED REAL QR CODE MODAL -->
  <div id="qr-modal" class="modal" onclick="closeQRModal()">
    <div class="modal-content modal-centered-content" onclick="event.stopPropagation()">
      <span class="close-x" onclick="closeQRModal()">✕</span>
      <h3 style="margin-top: 0; color: #2c3e50; margin-bottom: 15px;">Deck QR Link</h3>
      <div id="classroom-qr-container"></div>
    </div>
  </div>

<script>
let originalDeck = []; 
let activeDeck = []; 
let currentIndex = 0;
let isFlipped = false;
let isActionFrozen = false; 
let deckTitle = "Custom Deck"; 

window.onload = function() {
    if (originalDeck.length > 0) {
      document.getElementById('deck-title-display').textContent = deckTitle;
      startApp();
    }
};

// --- KEYBOARD SHORTCUTS ---
document.addEventListener('keydown', function(event) {
  if (event.target.tagName === 'TEXTAREA' || event.target.tagName === 'INPUT' || isActionFrozen) return;

  const key = event.key.toLowerCase();
  
  if (key === 'v') {
    nextCard();
  }
  else if (key === 'z') {
    knowCard();
  } 
  else if (key === 'x') {
    discardCardWithPeek();
  } 
  else if (key === 'c') {
    toggleStar();
  }
  else if (key === 'e') {
    toggleError();
  }
  else if (key === ' ') {
    event.preventDefault(); 
    flipCard();
  }
});

function loadCustomDeck() {
  const titleInput = document.getElementById('deck-title-input').value.trim();
  if (titleInput) {
    deckTitle = titleInput;
  }
  document.getElementById('deck-title-display').textContent = deckTitle;

  const input = document.getElementById('csv-input').value.trim();
  if (!input) return alert("Please paste some data first!");
  const lines = input.split('\n');
  
  originalDeck = lines.map(line => {
    let parts = line.split('\t');
    if (parts.length < 2) {
      parts = line.split(',');
    }
    return { 
      sideA: parts[0] ? parts[0].trim() : "", 
      sideB: parts[1] ? parts[1].trim() : "",
      starred: false,
      hasError: false
    };
  }).filter(item => item.sideA || item.sideB);
  
  if (originalDeck.length === 0) return alert("No valid data found.");
  startApp();
}

function startApp() {
  document.getElementById('setup-container').style.display = 'none';
  document.getElementById('flashcard-view').style.display = 'flex';
  generateClassroomQR();
  resetDeckSequential(); 
}

function resetDeckSequential() {
  activeDeck = [...originalDeck]; 
  initSession();
}

function shuffleDeck() {
  activeDeck = [...activeDeck].sort(() => Math.random() - 0.5); 
  initSession();
}

function initSession() {
  currentIndex = 0;
  isFlipped = false;
  isActionFrozen = false;
  setButtonsDisabled(false);
  updateDisplay();
}

function setButtonsDisabled(disabledState) {
  document.getElementById("nextBtn").disabled = disabledState;
  document.getElementById("knowBtn").disabled = disabledState;
  document.getElementById("discardBtn").disabled = disabledState;
  document.getElementById("shuffleBtn").disabled = disabledState;
  document.getElementById("restartBtn").disabled = disabledState;
  document.getElementById("starBtn").disabled = disabledState;
  document.getElementById("errorBtn").disabled = disabledState;
}

function updateDisplay() {
  const current = activeDeck[currentIndex];
  const card = document.getElementById("card");
  const starIndicator = document.getElementById("star-indicator");
  const errorIndicator = document.getElementById("error-indicator");
  
  if (!current || activeDeck.length === 0 || currentIndex >= activeDeck.length) {
    card.innerHTML = "<b>Excellent!</b><br>All cards completed.";
    card.style.background = "#d4edda";
    starIndicator.style.visibility = "hidden";
    errorIndicator.style.visibility = "hidden";
    setButtonsDisabled(true);
    document.getElementById("restartBtn").disabled = false; 
    return;
  }

  document.getElementById("progress").textContent = `Card ${currentIndex + 1} of ${activeDeck.length}`;
  
  starIndicator.style.visibility = current.starred ? "visible" : "hidden";
  errorIndicator.style.visibility = current.hasError ? "visible" : "hidden";

  if (!isFlipped) {
    card.innerHTML = `<div>${current.sideA}</div>`; 
    card.style.background = "white";
    card.style.color = "#2c3e50";
  } else {
    card.innerHTML = `<div>${current.sideB}</div>`;
    card.style.background = "#eef6ff";
    card.style.color = "#1565c0";
  }
}

function flipCard() {
  if (currentIndex >= activeDeck.length || isActionFrozen) return;
  isFlipped = !isFlipped;
  updateDisplay();
}

function toggleStar() {
  if (currentIndex >= activeDeck.length || isActionFrozen) return;
  const currentActiveItem = activeDeck[currentIndex];
  currentActiveItem.starred = !currentActiveItem.starred;
  updateDisplay();
}

function toggleError() {
  if (currentIndex >= activeDeck.length || isActionFrozen) return;
  const currentActiveItem = activeDeck[currentIndex];
  currentActiveItem.hasError = !currentActiveItem.hasError;
  updateDisplay();
}

function nextCard() {
  if (currentIndex >= activeDeck.length || isActionFrozen) return;
  if (currentIndex < activeDeck.length - 1) {
    currentIndex++;
    isFlipped = false;
  } else {
    currentIndex = 0; 
    isFlipped = false;
  }
  updateDisplay();
}

function knowCard() {
  if (currentIndex >= activeDeck.length || isActionFrozen) return;
  activeDeck.splice(currentIndex, 1);
  if (currentIndex >= activeDeck.length) {
    currentIndex = 0; 
  }
  isFlipped = false;
  updateDisplay();
}

function discardCardWithPeek() {
  if (currentIndex >= activeDeck.length || isActionFrozen) return;
  
  isActionFrozen = true;
  isFlipped = true; 
  updateDisplay();
  setButtonsDisabled(true);

  setTimeout(() => {
    activeDeck.splice(currentIndex, 1);
    if (currentIndex >= activeDeck.length) {
      currentIndex = 0;
    }
    isFlipped = false;
    isActionFrozen = false;
    setButtonsDisabled(false);
    updateDisplay();
  }, 2000);
}

function showList(filterType) {
  const tbody = document.querySelector("#vocab-table tbody");
  const modalTitle = document.getElementById("modal-title");
  const downloadTxtBtn = document.getElementById("download-txt-btn");
  tbody.innerHTML = "";
  
  let listItems = [];
  downloadTxtBtn.style.display = "none";
  
  if (filterType === 'star') {
    listItems = originalDeck.filter(item => item.starred);
    modalTitle.textContent = "⭐ Starred Vocabulary List";
    if (listItems.length === 0) return alert("No starred items to display!");
  } else if (filterType === 'left') {
    listItems = activeDeck;
    modalTitle.textContent = "⏳ Remaining Vocabulary List";
    if (listItems.length === 0) return alert("No active items remaining!");
  } else if (filterType === 'error') {
    listItems = originalDeck.filter(item => item.hasError);
    modalTitle.textContent = "⚠️ Vocabulary Items to Correct";
    if (listItems.length === 0) return alert("No items marked with errors!");
    downloadTxtBtn.style.display = "block"; 
  } else {
    listItems = originalDeck;
    modalTitle.textContent = "Full Vocabulary List";
  }

  listItems.forEach(item => {
    const row = tbody.insertRow();
    const cell1 = row.insertCell(0);
    const cell2 = row.insertCell(1);
    
    let label = item.sideA;
    if (item.starred) label = `⭐ ${label}`;
    if (item.hasError) label = `⚠️ ${label}`;
    
    cell1.innerHTML = label;
    cell2.innerHTML = item.sideB;
  });
  document.getElementById("list-modal").style.display = "block";
}

function closeList() { document.getElementById("list-modal").style.display = "none"; }

/* INFO MODAL CONTROLS */
function openInfoModal() { document.getElementById("info-modal").style.display = "block"; }
function closeInfoModal() { document.getElementById("info-modal").style.display = "none"; }

/* QR MODAL CONTROLS */
function openQRModal() { document.getElementById("qr-modal").style.display = "block"; }
function closeQRModal() { document.getElementById("qr-modal").style.display = "none"; }

function downloadErrorTxt() {
  const errorItems = originalDeck.filter(item => item.hasError);
  if (errorItems.length === 0) return alert("No items to download.");
  
  const txtContent = errorItems.map(item => `${item.sideA}\t${item.sideB}`).join('\n');
  
  const blob = new Blob([txtContent], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'errors_to_correct.txt';
  a.click();
}

function generateClassroomQR() {
  const currentUrl = window.location.href;
  const qrApiUrl = `https://quickchart.io/qr?text=${encodeURIComponent(currentUrl)}&size=220&margin=1`;
  const qrImg = new Image();
  qrImg.src = qrApiUrl;
  qrImg.onload = function() {
    const container = document.getElementById("classroom-qr-container");
    if(container) { container.innerHTML = ""; container.appendChild(qrImg); }
  };
}

function downloadDeck(mode) {
    let targetDeck = [];
    let filename = 'MyFlashcards.html';

    if (mode === 'full') {
      targetDeck = originalDeck;
      filename = 'Flashcards_Full.html';
    } else if (mode === 'left') {
      targetDeck = activeDeck;
      filename = 'Flashcards_Remaining.html';
    } else if (mode === 'star') {
      targetDeck = originalDeck.filter(item => item.starred);
      filename = 'Flashcards_Starred.html';
      if(targetDeck.length === 0) return alert("You haven't starred any cards yet!");
    }

    const cleanDeck = targetDeck.map(item => ({
      sideA: item.sideA,
      sideB: item.sideB,
      starred: item.starred,
      hasError: item.hasError
    }));

    let docHtml = document.documentElement.outerHTML;
    const dataString = `let originalDeck = ${JSON.stringify(cleanDeck)};\nlet deckTitle = ${JSON.stringify(deckTitle)};`;
    let finalHtml = docHtml.replace(/let originalDeck = \[.*?\];/, dataString);
    
    const blob = new Blob([finalHtml], { type: 'text/html' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
}
</script>

</body>
</html>
