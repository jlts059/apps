<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Cronómetro Zen - 10 Pestañas</title>
    <style>
        :root {
            --dark-border: #2b2b2b;
            
            /* Colores de botones mate y relajantes */
            --btn-start-pastel: #a3cfbb; 
            --btn-clear-pastel: #e6a1a1; 
            --btn-edit-pastel: #e2e3e5;  

            /* Fondos pastel sutiles */
            --bg-tab-0: #f3f7f5;
            --bg-tab-1: #f5f2f9;
            --bg-tab-2: #f2f5f8;
            --bg-tab-3: #fdf8f2;
            --bg-tab-4: #f4f8f3;
            --bg-tab-5: #faf3f5;
            --bg-tab-6: #f6f7f2;
            --bg-tab-7: #f1f6f8;
            --bg-tab-8: #fbf5ef;
            --bg-tab-9: #f8f8f8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #111111;
            display: flex;
            flex-direction: column;
            transition: background-color 0.4s ease;
        }

        .tabs {
            display: flex;
            background: #ffffff;
            border-bottom: 1px solid #e5e5e5;
            z-index: 5;
            overflow-x: auto;
            scrollbar-width: thin;
            flex-shrink: 0;
        }

        .tabs::-webkit-scrollbar {
            height: 4px;
        }

        .tabs::-webkit-scrollbar-thumb {
            background-color: #ccc;
            border-radius: 4px;
        }

        .tab-btn {
            flex: 1 1 0px;
            min-width: 55px;
            padding: 12px 6px;
            border: none;
            background: none;
            color: #88888d;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border-bottom: 3px solid transparent;
            text-align: center;
            white-space: nowrap;
        }

        .tab-btn-custom {
            flex: 1.3 1 0px;
            font-size: 15px;
        }

        .tab-btn.active {
            color: #111111;
            border-bottom: 3px solid #111111;
            font-weight: 700;
        }

        /* Contenedor principal */
        .main-content {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
        }

        .tab-content {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 2vh 16px 4vh 16px;
            box-sizing: border-box;
        }

        .tab-content.active {
            display: flex;
        }

        #tab-0 { background-color: var(--bg-tab-0); }
        #tab-1 { background-color: var(--bg-tab-1); }
        #tab-2 { background-color: var(--bg-tab-2); }
        #tab-3 { background-color: var(--bg-tab-3); }
        #tab-4 { background-color: var(--bg-tab-4); }
        #tab-5 { background-color: var(--bg-tab-5); }
        #tab-6 { background-color: var(--bg-tab-6); }
        #tab-7 { background-color: var(--bg-tab-7); }
        #tab-8 { background-color: var(--bg-tab-8); }
        #tab-9 { background-color: var(--bg-tab-9); }

        /* DISPLAY DE TIEMPO EN MODO RETRATO (PORTRAIT) */
        .timer-display {
            font-size: clamp(4rem, 26vw, 32vh); 
            font-weight: 700;
            font-variant-numeric: tabular-nums; 
            color: #111111;
            line-height: 0.9;
            text-align: center;
            margin: auto 0;
            letter-spacing: -0.03em;
            user-select: none;
            max-width: 100%;
            word-break: keep-all;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        .btn {
            flex: 1;
            padding: 16px 8px;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            border: 3px solid var(--dark-border);
            border-radius: 16px;
            cursor: pointer;
            transition: transform 0.1s, filter 0.2s;
            box-shadow: 0 4px 0px var(--dark-border);
            user-select: none;
        }

        .btn:active { 
            transform: translateY(4px);
            box-shadow: 0 0px 0px var(--dark-border);
        }

        .btn-start { background-color: var(--btn-start-pastel); color: #1c3d2e; }
        .btn-clear { background-color: var(--btn-clear-pastel); color: #5a2c2c; }
        .btn-edit { background-color: var(--btn-edit-pastel); color: #333333; }

        .btn:hover { filter: brightness(0.94); }

        /* Keypad Overlay Adaptativo */
        .keypad-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.98);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 16px;
            z-index: 10;
        }

        .keypad-overlay.open { display: flex; }

        .keypad-screen {
            font-size: clamp(18px, 5vw, 26px);
            font-weight: bold;
            background: #222222;
            color: #a3cfbb;
            padding: 10px 24px;
            border: 3px solid var(--dark-border);
            border-radius: 12px;
            margin-bottom: 16px;
            font-family: monospace;
            text-align: center;
            box-shadow: 0 4px 0px var(--dark-border);
        }

        .keypad-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(60px, 85px));
            grid-template-rows: repeat(4, minmax(45px, 65px));
            gap: 10px;
        }

        .key-btn {
            background-color: var(--btn-edit-pastel);
            color: #111111;
            font-size: clamp(20px, 6vw, 28px);
            font-weight: bold;
            border: 3px solid var(--dark-border);
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 3px 0px var(--dark-border);
            user-select: none;
        }

        .key-btn:active {
            transform: translateY(3px);
            box-shadow: 0 0px 0px var(--dark-border);
        }

        .key-btn.set-key { background-color: var(--btn-start-pastel); font-size: 16px; color: #1c3d2e; }
        .key-btn.clear-key { font-size: 15px; }

        /* OPTIMIZACIÓN EN MODO APAISA/HORIZONTAL (LANDSCAPE) */
        @media (orientation: landscape) {
            .tab-btn {
                padding: 8px 6px;
                font-size: 14px;
            }
            .tab-content {
                padding: 2px 24px 12px 24px;
            }
            /* Aumenta el tamaño del texto para llenar la pantalla a lo ancho */
            .timer-display {
                font-size: clamp(6rem, 40vh, 26vw);
                line-height: 0.85;
                margin: auto 0;
            }
            .actions {
                max-width: 550px;
            }
            .btn {
                padding: 10px 6px;
                font-size: 15px;
                border-radius: 12px;
            }
            .keypad-overlay {
                flex-direction: row;
                gap: 20px;
            }
            .keypad-screen {
                margin-bottom: 0;
            }
            .keypad-grid {
                grid-template-columns: repeat(3, minmax(50px, 70px));
                grid-template-rows: repeat(4, minmax(35px, 45px));
                gap: 6px;
            }
        }
    </style>
</head>
<body>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab(0)">2</button>
        <button class="tab-btn" onclick="switchTab(1)">3</button>
        <button class="tab-btn" onclick="switchTab(2)">4</button>
        <button class="tab-btn" onclick="switchTab(3)">5</button>
        <button class="tab-btn" onclick="switchTab(4)">10</button>
        <button class="tab-btn" onclick="switchTab(5)">15</button>
        <button class="tab-btn" onclick="switchTab(6)">20</button>
        <button class="tab-btn" onclick="switchTab(7)">30</button>
        <button class="tab-btn" onclick="switchTab(8)">40</button>
        <button class="tab-btn tab-btn-custom" onclick="switchTab(9)">Custom</button>
    </div>

    <div class="main-content" id="main-container"></div>

<script>
    const defaultTimes = [120, 180, 240, 300, 600, 900, 1200, 1800, 2400, 0]; 

    let currentTimes = [...defaultTimes]; 
    let timeRemaining = [...defaultTimes]; 
    let targetTimes = new Array(10).fill(null); 
    let intervals = new Array(10).fill(null);
    let keypadInputs = new Array(10).fill(""); 

    const workerCode = `
        let timerId = null;
        self.onmessage = function(e) {
            if (e.data === 'start') {
                if (!timerId) {
                    timerId = setInterval(() => {
                        self.postMessage('tick');
                    }, 250);
                }
            } else if (e.data === 'stop') {
                clearInterval(timerId);
                timerId = null;
            }
        };
    `;
    const blob = new Blob([workerCode], { type: 'application/javascript' });
    const worker = new Worker(URL.createObjectURL(blob));

    worker.onmessage = function() {
        for (let i = 0; i < 10; i++) {
            if (intervals[i]) {
                const remainingMs = targetTimes[i] - Date.now();
                const remainingSecs = Math.ceil(remainingMs / 1000);
                
                timeRemaining[i] = remainingSecs;
                
                if (remainingSecs <= 0) {
                    timeRemaining[i] = 0;
                    updateDisplay(i, 0);
                    
                    intervals[i] = null;
                    checkWorkerState();
                    
                    const startBtn = document.getElementById(`start-${i}`);
                    if (startBtn) {
                        startBtn.innerText = "Start";
                        startBtn.style.backgroundColor = "var(--btn-start-pastel)";
                    }
                    
                    playZenHarpArpeggio(); 
                    autoResetTimer(i); 
                } else {
                    updateDisplay(i, remainingSecs);
                }
            }
        }
    };

    function checkWorkerState() {
        const anyActive = intervals.some(val => val !== null);
        if (!anyActive) {
            worker.postMessage('stop');
        }
    }

    function renderTabsHTML() {
        const container = document.getElementById('main-container');
        let html = '';

        for (let i = 0; i < 10; i++) {
            const mins = Math.floor(defaultTimes[i] / 60).toString().padStart(2, '0');
            const secs = (defaultTimes[i] % 60).toString().padStart(2, '0');
            const isActive = i === 0 ? 'active' : '';

            html += `
            <div id="tab-${i}" class="tab-content ${isActive}">
                <div class="timer-display" id="display-${i}">${mins}:${secs}</div>
                <div class="actions">
                    <button class="btn btn-start" id="start-${i}" onclick="toggleTimer(${i})">Start</button>
                    <button class="btn btn-clear" onclick="clearTimer(${i})">Reset</button>
                    <button class="btn btn-edit" onclick="toggleKeypad(${i})">Edit</button>
                </div>
                <div class="keypad-overlay" id="keypad-${i}">
                    <div class="keypad-screen" id="key-screen-${i}">Mins: 00 | Segs: 00</div>
                    <div class="keypad-grid">
                        <button class="key-btn" onclick="pressNum(${i}, 1)">1</button>
                        <button class="key-btn" onclick="pressNum(${i}, 2)">2</button>
                        <button class="key-btn" onclick="pressNum(${i}, 3)">3</button>
                        <button class="key-btn" onclick="pressNum(${i}, 4)">4</button>
                        <button class="key-btn" onclick="pressNum(${i}, 5)">5</button>
                        <button class="key-btn" onclick="pressNum(${i}, 6)">6</button>
                        <button class="key-btn" onclick="pressNum(${i}, 7)">7</button>
                        <button class="key-btn" onclick="pressNum(${i}, 8)">8</button>
                        <button class="key-btn" onclick="pressNum(${i}, 9)">9</button>
                        <button class="key-btn clear-key" onclick="clearKeypad(${i})">Clear</button>
                        <button class="key-btn" onclick="pressNum(${i}, 0)">0</button>
                        <button class="key-btn set-key" onclick="setTimer(${i})">Set</button>
                    </div>
                </div>
            </div>
            `;
        }
        container.innerHTML = html;
    }

    function switchTab(tabIndex) {
        document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
            btn.classList.toggle('active', idx === tabIndex);
        });
        document.querySelectorAll('.tab-content').forEach((content, idx) => {
            content.classList.toggle('active', idx === tabIndex);
        });
    }

    function updateDisplay(tabIndex, totalSeconds) {
        const displayEl = document.getElementById(`display-${tabIndex}`);
        if (displayEl) {
            const mins = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
            const secs = (totalSeconds % 60).toString().padStart(2, '0');
            displayEl.innerText = `${mins}:${secs}`;
        }
    }

    function toggleTimer(tabIndex) {
        const startBtn = document.getElementById(`start-${tabIndex}`);
        
        if (intervals[tabIndex]) {
            intervals[tabIndex] = null;
            checkWorkerState();
            
            const remaining = Math.max(0, Math.ceil((targetTimes[tabIndex] - Date.now()) / 1000));
            timeRemaining[tabIndex] = remaining;
            
            startBtn.innerText = "Start";
            startBtn.style.backgroundColor = "var(--btn-start-pastel)";
        } else {
            if (timeRemaining[tabIndex] <= 0) return;
            
            startBtn.innerText = "Pause";
            startBtn.style.backgroundColor = "#ffebad"; 
            
            targetTimes[tabIndex] = Date.now() + (timeRemaining[tabIndex] * 1000);
            intervals[tabIndex] = true;
            
            worker.postMessage('start');
        }
    }

    function clearTimer(tabIndex) {
        intervals[tabIndex] = null;
        checkWorkerState();
        targetTimes[tabIndex] = null;
        timeRemaining[tabIndex] = currentTimes[tabIndex];
        updateDisplay(tabIndex, timeRemaining[tabIndex]);
        
        const startBtn = document.getElementById(`start-${tabIndex}`);
        startBtn.innerText = "Start";
        startBtn.style.backgroundColor = "var(--btn-start-pastel)";
    }

    function autoResetTimer(tabIndex) {
        timeRemaining[tabIndex] = currentTimes[tabIndex];
        updateDisplay(tabIndex, timeRemaining[tabIndex]);
    }

    function toggleKeypad(tabIndex) {
        const keypad = document.getElementById(`keypad-${tabIndex}`);
        keypad.classList.toggle('open');
        clearKeypad(tabIndex);
    }

    function pressNum(tabIndex, num) {
        if (keypadInputs[tabIndex].length >= 4) return; 
        keypadInputs[tabIndex] += num;
        renderKeypadScreen(tabIndex);
    }

    function clearKeypad(tabIndex) {
        keypadInputs[tabIndex] = "";
        renderKeypadScreen(tabIndex);
    }

    function renderKeypadScreen(tabIndex) {
        const digits = keypadInputs[tabIndex].padStart(4, '0');
        const mins = digits.substring(0, 2);
        const secs = digits.substring(2, 4);
        document.getElementById(`key-screen-${tabIndex}`).innerText = `Mins: ${mins} | Segs: ${secs}`;
    }

    function setTimer(tabIndex) {
        const digits = keypadInputs[tabIndex].padStart(4, '0');
        const mins = parseInt(digits.substring(0, 2), 10);
        const secs = parseInt(digits.substring(2, 4), 10);
        
        if (secs >= 60) {
            alert("Los segundos deben ser de 00 a 59");
            return;
        }

        const totalSeconds = (mins * 60) + secs;

        currentTimes[tabIndex] = totalSeconds;
        clearTimer(tabIndex); 
        toggleKeypad(tabIndex); 
    }

    function playZenHarpArpeggio() {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        
        const notasHarp = [
            130.81, 164.81, 196.00, 261.63, 329.63, 392.00, 523.25, 
            659.25, 523.25, 392.00, 329.63, 261.63, 196.00, 164.81
        ]; 
        
        const tempoLento = 280; 
        const resonanciaSustendida = 6.0; 

        notasHarp.forEach((freq, index) => {
            setTimeout(() => {
                const osc = ctx.createOscillator();
                const gainNode = ctx.createGain();
                
                osc.type = 'sine'; 
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                
                gainNode.gain.setValueAtTime(0.001, ctx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.18, ctx.currentTime + 0.05); 
                gainNode.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + resonanciaSustendida); 
                
                osc.connect(gainNode);
                gainNode.connect(ctx.destination);
                
                osc.start();
                osc.stop(ctx.currentTime + resonanciaSustendida);
            }, index * tempoLento);
        });
    }

    window.onload = function() {
        renderTabsHTML();
    };
</script>

</body>
</html>
