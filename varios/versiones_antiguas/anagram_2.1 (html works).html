<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Anagramas</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --hint-blue: #2563eb;
            --success-green: #16a34a;
            --success-bg: #f0fdf4;
            --danger-red: #dc2626;
            --danger-bg: #fef2f2;
            --orange-border: #ea580c;
            --orange-bg: #fff7ed;
            --neutral-dark: #1f2937;
            --neutral-light: #f3f4f6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #fafafa; color: var(--neutral-dark); min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
        
        .container { width: 100%; max-width: 800px; margin: 0 auto; padding: 20px; }
        .hidden { display: none !important; }
        .screen { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }

        h1 { font-size: 1.5rem; margin-bottom: 20px; text-align: center; color: #111827; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; }
        input[type="text"], textarea { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 1rem; }
        textarea { height: 120px; font-family: monospace; resize: vertical; }
        .btn-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
        
        button { padding: 12px 8px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.95rem; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: background 0.2s; }
        .btn-primary { background: #3b82f6; color: white; }
        .btn-primary:hover { background: #2563eb; }
        .btn-secondary { background: #6b7280; color: white; }
        .btn-secondary:hover { background: #5a616c; }
        .btn-success { background: var(--success-green); color: white; }
        .btn-success:hover { background: #15803d; }

        .game-header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin-bottom: 24px; gap: 10px; }
        .header-left { display: flex; flex-direction: column; }
        .counter { font-size: 1.1rem; font-weight: bold; }
        .timer { font-size: 0.9rem; color: #6b7280; font-variant-numeric: tabular-nums; }
        .header-center { font-size: 1.3rem; font-weight: bold; text-align: center; color: var(--hint-blue); word-break: break-word; }
        .header-right { display: flex; align-items: center; justify-content: flex-end; gap: 12px; }
        
        .icon-btn { font-size: 1.5rem; cursor: pointer; background: none; border: none; padding: 0; line-height: 1; }
        .qr-box { width: 40px; height: 40px; border: 1px solid #e5e7eb; padding: 2px; background: white; cursor: pointer; }
        .qr-box img { width: 100% !important; height: 100% !important; }
        
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
        .modal-content { background: white; padding: 20px; border-radius: 8px; max-width: 400px; width: 100%; position: relative; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); }
        .close-modal { position: absolute; top: 10px; right: 14px; font-size: 1.2rem; cursor: pointer; background: none; border: none; font-weight: bold; }
        .qr-large-dest { display: flex; justify-content: center; margin-top: 15px; }
        .qr-large-dest img { width: 200px !important; height: 200px !important; }

        .letters-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 24px 0; min-height: 50px; padding: 6px; border-radius: 8px; }
        #pool-row { background: #f8fafc; border: 1px dashed #cbd5e1; }
        #target-row { background: #f1f5f9; border: 2px solid #e2e8f0; }

        .letter-block { width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; font-weight: bold; border-radius: 6px; border: 2px solid; user-select: none; cursor: pointer; transition: all 0.15s; text-transform: uppercase; }
        
        .letter-block.status-hint { background-color: #eff6ff !important; border-color: var(--hint-blue) !important; color: var(--hint-blue) !important; }
        .letter-block.status-placed { background-color: white; border-color: #94a3b8; color: black; }
        .letter-block.orange-active { background-color: var(--orange-bg) !important; border-color: var(--orange-border) !important; color: var(--orange-border) !important; }
        .letter-block.status-correct { background-color: var(--success-bg) !important; border-color: var(--success-green) !important; color: var(--success-green) !important; }
        .letter-block.status-incorrect { background-color: var(--danger-bg) !important; border-color: var(--danger-red) !important; color: var(--danger-red) !important; }
        .letter-block.empty-slot { background-color: #e2e8f0; border-color: #cbd5e1; color: transparent; border-style: dashed; }

        .validation-wrapper { display: flex; justify-content: center; align-items: center; height: 30px; margin-bottom: 10px; font-size: 1.8rem; font-weight: bold; }
        .validation-feedback.tick { color: var(--success-green); }
        .validation-feedback.cross { color: var(--danger-red); }

        .results-list { list-style: none; margin-top: 15px; max-height: 300px; overflow-y: auto; }
        .results-list li { padding: 8px; border-bottom: 1px solid #edf2f7; font-size: 1.05rem; display: flex; align-items: center; gap: 8px; }
        .res-correct { color: var(--success-green); }
        .res-incorrect { color: var(--danger-red); text-decoration: line-through; }
        .res-solution { color: var(--hint-blue); font-weight: bold; text-decoration: none !important; margin-left: 5px; }

        .watermark { font-size: 0.85rem; color: #9ca3af; padding: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; align-self: flex-start; }

        @media (max-width: 600px) {
            .game-header { grid-template-columns: auto 1fr auto; }
            .header-center { font-size: 1.1rem; }
            .letter-block { width: 36px; height: 36px; font-size: 1rem; }
            .btn-group { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="start-screen" class="screen">
            <h1>Generador de Anagramas</h1>
            <div class="form-group">
                <label for="game-title">Título del juego (Marca de agua):</label>
                <input type="text" id="game-title" placeholder="Ej. Vocabulario Inglés - Unidad 1">
            </div>
            <div class="form-group">
                <label for="game-data">Términos (Binomios separados por coma o tabulados):</label>
                <textarea id="game-data" placeholder="Perro, Dog&#10;Gato, Cat&#10;Casa, House"></textarea>
            </div>
            <div class="btn-group">
                <button class="btn-primary" onclick="startGame(false)">GO</button>
                <button class="btn-secondary" onclick="startGame(true)">SHUFFLE</button>
                <button class="btn-success" onclick="exportHTML()">HTML 💾</button>
            </div>
        </div>

        <div id="game-screen" class="screen hidden">
            <div class="game-header">
                <div class="header-left">
                    <span class="counter" id="item-counter">1 / 10</span>
                    <span class="timer" id="game-timer">00:00</span>
                </div>
                <div class="header-center" id="clue-display">CONCEPTO</div>
                <div class="header-right">
                    <button class="icon-btn" onclick="showInfo()">🟦</button>
                    <div id="qr-container" class="qr-box" onclick="showQR()"></div>
                </div>
            </div>

            <div class="letters-container" id="pool-row"></div>
            <div class="letters-container" id="target-row"></div>
            <div class="validation-wrapper" id="feedback-layer"></div>

            <div class="btn-group" style="grid-template-columns: repeat(3, 1fr);">
                <button class="btn-success" onclick="manualCheck()">OK?</button>
                <button class="btn-secondary" onclick="passItem()">PASS</button>
                <button class="btn-primary" style="background:#ef4444" onclick="stopAndScore()">STOP & SCORE</button>
            </div>
        </div>

        <div id="score-screen" class="screen hidden">
            <h1>Resultados Finales</h1>
            <p id="final-time" style="text-align:center; color:#4b5563; font-weight:500;"></p>
            <ul id="results-list" class="results-list"></ul>
            <button class="btn-primary" style="margin-top:20px; width:100%;" onclick="resetApp()">Reiniciar Juego</button>
        </div>
    </div>

    <div id="game-watermark" class="watermark hidden"></div>

    <div id="info-modal" class="modal hidden">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModals()">✕</button>
            <p style="font-size:0.95rem; line-height:1.5;">Toca una letra para colocarla. Al marcar una letra colocada pasará a naranja; toca otra letra para intercambiarlas o pulsa de nuevo para devolverla a la caja original.</p>
        </div>
    </div>

    <div id="qr-modal" class="modal hidden">
        <div class="modal-content" style="text-align:center;">
            <button class="close-modal" onclick="closeModals()">✕</button>
            <h3>Escanea para compartir</h3>
            <div id="qr-large" class="qr-large-dest"></div>
        </div>
    </div>

    <script>
        let items = [];
        let currentIndex = 0;
        let timerInterval = null;
        let secondsElapsed = 0;
        let poolLetters = [];   
        let targetLetters = []; 
        let activeOrangeIndex = null;

        window.onload = function() {
            new QRCode(document.getElementById("qr-container"), { text: window.location.href, width: 40, height: 40 });
            new QRCode(document.getElementById("qr-large"), { text: window.location.href, width: 200, height: 200 });
        };

        function parseData() {
            const rawText = document.getElementById("game-data").value.trim();
            if (!rawText) return [];
            return rawText.split('\n').map(line => {
                let parts = line.includes('\t') ? line.split('\t') : line.split(',');
                if (parts.length >= 2) {
                    return { clue: parts[0].trim(), answer: parts[1].trim().toUpperCase().replace(/\s+/g, '') };
                }
                return null;
            }).filter(item => item !== null);
        }

        function startGame(shuffleMode) {
            items = parseData();
            if (items.length === 0) return alert("Introduce binomios válidos.");
            if (shuffleMode) items.sort(() => Math.random() - 0.5);

            const title = document.getElementById("game-title").value.trim();
            const watermarkEl = document.getElementById("game-watermark");
            if (title) { watermarkEl.innerText = title; watermarkEl.classList.remove('hidden'); }

            currentIndex = 0; secondsElapsed = 0;
            items.forEach(item => item.status = null);
            document.getElementById("start-screen").classList.add('hidden');
            document.getElementById("game-screen").classList.remove('hidden');
            startTimer();
            loadItem();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                secondsElapsed++;
                let min = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
                let sec = String(secondsElapsed % 60).padStart(2, '0');
                document.getElementById("game-timer").innerText = `${min}:${sec}`;
            }, 1000);
        }

        function loadItem() {
            activeOrangeIndex = null;
            document.getElementById("feedback-layer").innerHTML = "";
            if (currentIndex >= items.length) { stopAndScore(); return; }

            const currentItem = items[currentIndex];
            document.getElementById("item-counter").innerText = `${currentIndex + 1} / ${items.length}`;
            document.getElementById("clue-display").innerText = currentItem.clue;

            let chars = currentItem.answer.split('');
            let shuffled = [...chars].sort(() => Math.random() - 0.5);
            if (shuffled.join('') === currentItem.answer && chars.length > 1) shuffled.reverse();

            poolLetters = shuffled.map((c, idx) => ({ id: idx, char: c, active: true }));
            targetLetters = Array(chars.length).fill(null);
            renderBoards();
        }

        function renderBoards() {
            const poolRow = document.getElementById("pool-row");
            const targetRow = document.getElementById("target-row");
            poolRow.innerHTML = ""; targetRow.innerHTML = "";

            poolLetters.forEach(item => {
                if (item.active) {
                    const block = document.createElement("div");
                    block.className = "letter-block status-hint";
                    block.innerText = item.char;
                    block.onclick = () => handlePoolClick(item);
                    poolRow.appendChild(block);
                }
            });

            targetLetters.forEach((item, idx) => {
                const block = document.createElement("div");
                if (item === null) {
                    block.className = "letter-block empty-slot";
                    block.onclick = () => handleTargetEmptyClick(idx);
                } else {
                    block.className = "letter-block status-placed";
                    if (activeOrangeIndex === idx) block.classList.add("orange-active");
                    block.innerText = item.char;
                    block.onclick = () => handleTargetFilledClick(idx);
                }
                targetRow.appendChild(block);
            });
        }

        function handlePoolClick(poolItem) {
            let emptyIdx = targetLetters.indexOf(null);
            if (emptyIdx !== -1) {
                targetLetters[emptyIdx] = { id: poolItem.id, char: poolItem.char };
                poolItem.active = false;
                renderBoards();
                checkAutoValidation();
            }
        }

        function handleTargetEmptyClick(targetIdx) {
            if (activeOrangeIndex !== null) {
                targetLetters[targetIdx] = targetLetters[activeOrangeIndex];
                targetLetters[activeOrangeIndex] = null;
                activeOrangeIndex = null;
                renderBoards();
                checkAutoValidation();
            }
        }

        function handleTargetFilledClick(targetIdx) {
            if (activeOrangeIndex === null) {
                activeOrangeIndex = targetIdx;
                renderBoards();
            } else if (activeOrangeIndex === targetIdx) {
                let poolItem = poolLetters.find(p => p.id === targetLetters[targetIdx].id);
                if (poolItem) poolItem.active = true;
                targetLetters[targetIdx] = null;
                activeOrangeIndex = null;
                renderBoards();
            } else {
                let temp = targetLetters[targetIdx];
                targetLetters[targetIdx] = targetLetters[activeOrangeIndex];
                targetLetters[activeOrangeIndex] = temp;
                activeOrangeIndex = null;
                renderBoards();
                checkAutoValidation();
            }
        }

        function checkAutoValidation() {
            if (targetLetters.includes(null)) return;
            if (targetLetters.map(l => l.char).join('') === items[currentIndex].answer) {
                items[currentIndex].status = true;
                showInstantFeedback(true);
                colorTargetBlocks("status-correct");
                setTimeout(() => { currentIndex++; loadItem(); }, 900);
            }
        }

        function manualCheck() {
            if (targetLetters.includes(null)) return;
            if (targetLetters.map(l => l.char).join('') === items[currentIndex].answer) {
                items[currentIndex].status = true;
                showInstantFeedback(true);
                colorTargetBlocks("status-correct");
                setTimeout(() => { currentIndex++; loadItem(); }, 900);
            } else {
                showInstantFeedback(false);
                colorTargetBlocks("status-incorrect");
            }
        }

        function colorTargetBlocks(className) {
            for(let btn of document.getElementById("target-row").children) btn.className = `letter-block ${className}`;
        }

        function showInstantFeedback(isCorrect) {
            document.getElementById("feedback-layer").innerHTML = isCorrect ? 
                `<span class="validation-feedback tick">✓ Correcto</span>` : `<span class="validation-feedback cross">✕ Incorrecto</span>`;
        }

        function passItem() {
            let current = items.splice(currentIndex, 1)[0];
            items.push(current);
            loadItem();
        }

        function stopAndScore() {
            clearInterval(timerInterval);
            document.getElementById("game-screen").classList.add('hidden');
            document.getElementById("score-screen").classList.remove('hidden');
            let min = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
            let sec = String(secondsElapsed % 60).padStart(2, '0');
            document.getElementById("final-time").innerText = `Tiempo total empleado: ${min}:${sec}`;

            const listContainer = document.getElementById("results-list");
            listContainer.innerHTML = "";
            items.forEach(item => {
                const li = document.createElement("li");
                li.innerHTML = item.status === true ? `<span class="res-correct">✓</span> <strong>${item.clue}:</strong>&nbsp;${item.answer}` :
                    `<span class="res-incorrect">✕ <strong>${item.clue}:</strong> ${item.answer}</span> <span class="res-solution">→ Solución: ${item.answer}</span>`;
                listContainer.appendChild(li);
            });
        }

        function resetApp() {
            document.getElementById("score-screen").classList.add('hidden');
            document.getElementById("game-watermark").classList.add('hidden');
            document.getElementById("start-screen").classList.remove('hidden');
        }

        function showInfo() { document.getElementById("info-modal").classList.remove('hidden'); }
        function showQR() { document.getElementById("qr-modal").classList.remove('hidden'); }
        function closeModals() { document.getElementById("info-modal").classList.add('hidden'); document.getElementById("qr-modal").classList.add('hidden'); }

        // --- EXPORTACIÓN E INYECCIÓN DE CÓDIGO LIMPIO ---
        function exportHTML() {
            const titleValue = document.getElementById("game-title").value.trim() || "Anagrama";
            const parsedItems = parseData();
            if(parsedItems.length === 0) return alert("Ingresa datos primero.");

            const styles = document.getElementsByTagName("style")[0].innerHTML;

            // Arreglado: Inyección directa de las variables en texto plano dentro de la plantilla HTML
            const outputHTML = `<!DOCTYPE html>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"><` + `/script>
    <style>${styles}</style>

            <div style="display:flex; justify-content:center; align-items:center; gap:20px; margin-bottom:30px;">
                <button class="icon-btn" onclick="showInfo()">🟦</button>
                <div id="qr-container" class="qr-box" onclick="showQR()"></div>
            </div>

            <div class="btn-group" style="grid-template-columns: 1fr 1fr; max-width:400px; margin:0 auto;">
                <button class="btn-primary" onclick="startGame(false)">GO</button>

                </div>
                <div class="header-center" id="clue-display"></div>

                    <button class="icon-btn" onclick="showInfo()">🟦</button>
                    <div id="qr-container-game" class="qr-box" onclick="showQR()"></div>
                </div>
            </div>
            <div class="letters-container" id="pool-row"></div>
            <div class="letters-container" id="target-row"></div>
            <div class="validation-wrapper" id="feedback-layer"></div>
            <div class="btn-group" style="grid-template-columns: repeat(3, 1fr);">
                <button class="btn-success" onclick="manualCheck()">OK?</button>
                <button class="btn-secondary" onclick="passItem()">PASS</button>
                <button class="btn-primary" style="background:#ef4444" onclick="stopAndScore()">STOP & SCORE</button>
            </div>
        </div>

        <div id="score-screen" class="screen hidden">
            <h1>Resultados Finales</h1>
            <p id="final-time" style="text-align:center; color:#4b5563; font-weight:500;"></p>
            <ul id="results-list" class="results-list"></ul>
            <button class="btn-primary" style="margin-top:20px; width:100%;" onclick="resetApp()">Reiniciar</button>

    <div id="game-watermark" class="watermark hidden">${titleValue}</div>

    <div id="info-modal" class="modal hidden">
        <div class="modal-content">

        </div>
    </div>

        <div class="modal-content" style="text-align:center;">
            <button class="close-modal" onclick="closeModals()">✕</button>
            <h3>Escanea para compartir</h3>
            <div id="qr-large" class="qr-large-dest"></div>
        </div>
    </div>

    <` + `script>

                } else {
                    block.className = "letter-block status-placed";
                    if (activeOrangeIndex === idx) block.classList.add("orange-active");
                    block.innerText = item.char;
                    block.onclick = () => {
                        if (activeOrangeIndex === null) {
                            activeOrangeIndex = idx;
                            renderBoards();
                        } else if (activeOrangeIndex === idx) {
                            let poolItem = poolLetters.find(p => p.id === targetLetters[idx].id);
                            if (poolItem) poolItem.active = true;
                            targetLetters[idx] = null;
                            activeOrangeIndex = null;
                            renderBoards();
                        } else {
                            let temp = targetLetters[idx];
                            targetLetters[idx] = targetLetters[activeOrangeIndex];
                            targetLetters[activeOrangeIndex] = temp;
                            activeOrangeIndex = null;
                            renderBoards();
                            checkAutoValidation();
                        }
                    };
                }
                targetRow.appendChild(block);
            });
        }

        function checkAutoValidation() {
            if (targetLetters.includes(null)) return;
            if (targetLetters.map(l => l.char).join('') === items[currentIndex].answer) {
                items[currentIndex].status = true;
                document.getElementById("feedback-layer").innerHTML = \`<span class="validation-feedback tick">✓ Correcto</span>\`;
                for(let btn of document.getElementById("target-row").children) btn.className = 'letter-block status-correct';
                setTimeout(() => { currentIndex++; loadItem(); }, 900);
            }
        }

        function manualCheck() {
            if (targetLetters.includes(null)) return;
            if (targetLetters.map(l => l.char).join('') === items[currentIndex].answer) {
                items[currentIndex].status = true;
                document.getElementById("feedback-layer").innerHTML = \`<span class="validation-feedback tick">✓ Correcto</span>\`;
                for(let btn of document.getElementById("target-row").children) btn.className = 'letter-block status-correct';
                setTimeout(() => { currentIndex++; loadItem(); }, 900);
            } else {
                document.getElementById("feedback-layer").innerHTML = \`<span class="validation-feedback cross">✕ Incorrecto</span>\`;
                for(let btn of document.getElementById("target-row").children) btn.className = 'letter-block status-incorrect';
            }
        }

        function passItem() {
            let current = items.splice(currentIndex, 1)[0];
            items.push(current);
            loadItem();
        }

        function stopAndScore() {
            clearInterval(timerInterval);
            document.getElementById("game-screen").classList.add('hidden');
            document.getElementById("score-screen").classList.remove('hidden');
            let min = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
            let sec = String(secondsElapsed % 60).padStart(2, '0');
            document.getElementById("final-time").innerText = \`Tiempo total empleado: \${min}:\${sec}\`;
            const listContainer = document.getElementById("results-list");
            listContainer.innerHTML = "";
            items.forEach(item => {
                const li = document.createElement("li");
                li.innerHTML = item.status === true ? \`<span class="res-correct">✓</span> <strong>\${item.clue}:</strong>&nbsp;\${item.answer}\` :
                    \`<span class="res-incorrect">✕ <strong>\${item.clue}:</strong> \${item.answer}</span> <span class="res-solution">→ Solución: \${item.answer}</span>\`;
                listContainer.appendChild(li);
            });
        }

        function resetApp() {
            document.getElementById("score-screen").classList.add('hidden');
            document.getElementById("game-watermark").classList.add('hidden');
            document.getElementById("start-screen").classList.remove('hidden');
        }

        // Popups
        function showInfo() { document.getElementById("info-modal").classList.remove('hidden'); }
        function showQR() { document.getElementById("qr-modal").classList.remove('hidden'); }
        function closeModals() { document.getElementById("info-modal").classList.add('hidden'); document.getElementById("qr-modal").classList.add('hidden'); }
    <` + `/script>
</body>
</html>`;

            const blob = new Blob([outputHTML], { type: "text/html;charset=utf-8" });

            link.href = URL.createObjectURL(blob);
